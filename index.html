<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu App – Pasqua Maxwell</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-soft: #dbeafe;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem 3rem;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--primary-dark);
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 0.95rem;
      background: var(--primary-soft);
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 10px;
      transition: background 0.15s ease;
    }

    .repo-link:hover {
      background: #bfdbfe;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .controls input,
    .controls select {
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
    }

    .controls input {
      flex: 1 1 260px;
    }

    .controls select {
      flex: 0 1 auto;
    }

    .controls input:focus,
    .controls select:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
    }

    .folder-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.55rem;
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--text);
      word-break: break-word;
      margin-bottom: 0.3rem;
    }

    .file-path {
      font-size: 0.82rem;
      color: var(--muted);
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .status {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }

    .status.error {
      color: #991b1b;
      background: #fef2f2;
      border-color: #fecaca;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div>
          <h1>Menu App – Pasqua Maxwell</h1>
          <p class="subtitle">Indice automatico delle pagine HTML presenti su GitHub</p>
        </div>
        <a class="repo-link" href="https://github.com/Franca30/pasqua_maxwell" target="_blank" rel="noopener">
          Apri repository GitHub ↗
        </a>
      </div>

      <div class="controls">
        <input type="search" id="search" placeholder="Cerca un'app per nome o cartella..." aria-label="Cerca un'app">
        <select id="folder-filter" aria-label="Filtra per cartella">
          <option value="">Tutte le cartelle</option>
        </select>
        <select id="mode-select" aria-label="Modalità apertura link">
          <option value="pages">Apri via GitHub Pages (consigliato)</option>
          <option value="preview">Apri via HTMLPreview (se Pages non è attivo)</option>
        </select>
      </div>
    </header>

    <div class="meta-bar">
      <span id="counter">Caricamento...</span>
      <span id="branch-info"></span>
    </div>

    <main id="app-list" class="status">Caricamento elenco delle pagine HTML dal repository...</main>

    <footer>
      Repository: Franca30/pasqua_maxwell · Tutti i link puntano automaticamente alle pagine HTML caricate su Git.
    </footer>
  </div>

  <script>
    const OWNER = "Franca30";
    const REPO = "pasqua_maxwell";
    const PAGES_BASE = `https://${OWNER.toLowerCase()}.github.io/${REPO}/`;
    const IS_ON_GH_PAGES = window.location.hostname.toLowerCase() === `${OWNER.toLowerCase()}.github.io`;

    const listEl = document.getElementById("app-list");
    const searchEl = document.getElementById("search");
    const folderFilterEl = document.getElementById("folder-filter");
    const modeSelectEl = document.getElementById("mode-select");
    const counterEl = document.getElementById("counter");
    const branchInfoEl = document.getElementById("branch-info");

    let activeBranch = "main";
    let allPages = [];

    function encodePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function formatTitle(path) {
      const parts = path.split("/");
      const fileName = parts[parts.length - 1];
      const isIndexFile = /^index\.html?$/i.test(fileName);
      const rawName = (isIndexFile && parts.length > 1)
        ? parts[parts.length - 2]
        : fileName.replace(/\.html?$/i, "");

      return rawName
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function getFolder(path) {
      const idx = path.lastIndexOf("/");
      return idx === -1 ? "Cartella principale" : path.slice(0, idx);
    }

    function buildAppUrl(path) {
      const encoded = encodePath(path);
      if (modeSelectEl.value === "preview") {
        return `https://htmlpreview.github.io/?https://github.com/${OWNER}/${REPO}/blob/${activeBranch}/${encoded}`;
      }
      // Se aperto già su GitHub Pages usa percorso relativo; altrimenti punta all'URL live di GitHub Pages
      return IS_ON_GH_PAGES ? `./${encoded}` : `${PAGES_BASE}${encoded}`;
    }

    function buildGitHubUrl(path) {
      return `https://github.com/${OWNER}/${REPO}/blob/${activeBranch}/${encodePath(path)}`;
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      const selectedFolder = folderFilterEl.value;

      const filtered = allPages.filter((page) => {
        const matchesFolder = !selectedFolder || page.folder === selectedFolder;
        const matchesQuery = !query ||
          page.title.toLowerCase().includes(query) ||
          page.path.toLowerCase().includes(query) ||
          page.folder.toLowerCase().includes(query);
        return matchesFolder && matchesQuery;
      });

      counterEl.textContent = `${filtered.length} ${filtered.length === 1 ? "app trovata" : "app trovate"} su ${allPages.length}`;

      if (!filtered.length) {
        listEl.className = "status";
        listEl.textContent = "Nessuna pagina HTML corrisponde ai criteri di ricerca.";
        return;
      }

      listEl.className = "grid";
      listEl.innerHTML = filtered.map((page) => {
        const appUrl = buildAppUrl(page.path);
        const ghUrl = buildGitHubUrl(page.path);
        return `
          <article class="card">
            <div>
              <span class="folder-badge">${escapeHtml(page.folder)}</span>
              <h2>${escapeHtml(page.title)}</h2>
              <div class="file-path">${escapeHtml(page.path)}</div>
            </div>
            <div class="card-actions">
              <a class="btn btn-primary" href="${appUrl}" target="_blank" rel="noopener">Apri App</a>
              <a class="btn btn-secondary" href="${ghUrl}" target="_blank" rel="noopener">Codice Git</a>
            </div>
          </article>
        `;
      }).join("");
    }

    async function init() {
      try {
        // 1. Rileva automaticamente il branch principale (main o master)
        const repoRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`);
        if (!repoRes.ok) {
          throw new Error(repoRes.status === 404
            ? "Repository non trovato o privato (deve essere pubblico per la lettura automatica)."
            : `Errore GitHub API (${repoRes.status}).`);
        }
        const repoData = await repoRes.json();
        activeBranch = repoData.default_branch || "main";
        branchInfoEl.textContent = `Branch: ${activeBranch}`;

        // 2. Recupera l'intero albero dei file (anche dentro le sottocartelle)
        const treeRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${encodeURIComponent(activeBranch)}?recursive=1`);
        if (!treeRes.ok) {
          throw new Error(`Impossibile leggere i file del branch "${activeBranch}" (HTTP ${treeRes.status}).`);
        }
        const treeData = await treeRes.json();

        allPages = (treeData.tree || [])
          .filter((item) => item.type === "blob" && /\.html?$/i.test(item.path))
          .filter((item) => !/^index\.html?$/i.test(item.path)) // Esclude il menu stesso
          .map((item) => ({
            path: item.path,
            title: formatTitle(item.path),
            folder: getFolder(item.path)
          }))
          .sort((a, b) => a.folder.localeCompare(b.folder, "it") || a.title.localeCompare(b.title, "it"));

        // Popola il filtro per cartelle
        const folders = [...new Set(allPages.map((p) => p.folder))].sort((a, b) => a.localeCompare(b, "it"));
        folders.forEach((folder) => {
          const opt = document.createElement("option");
          opt.value = folder;
          opt.textContent = folder;
          folderFilterEl.appendChild(opt);
        });

        render();
      } catch (err) {
        counterEl.textContent = "Errore di caricamento";
        listEl.className = "status error";
        listEl.textContent = err.message || "Impossibile caricare l'elenco delle app da GitHub.";
      }
    }

    searchEl.addEventListener("input", render);
    folderFilterEl.addEventListener("change", render);
    modeSelectEl.addEventListener("change", render);

    init();
  </script>
</body>
</html>
